<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aplikasi Perhitungan & WA</title>
  <!-- Library html2canvas untuk ubah tabel B jadi gambar -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <style>
    body { font-family: sans-serif; padding: 15px; background: #f4f6f8; }
    .card { background: white; padding: 15px; border-radius: 8px; margin-bottom: 20px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
    table { width: 100%; border-collapse: collapse; margin-top: 10px; }
    th, td { border: 1px solid #ddd; padding: 8px; text-align: left; }
    th { background: #007bff; color: white; }
    #tabelB th { background: #28a745; }
    input { width: 90%; padding: 5px; }
    button { background: #25D366; color: white; border: none; padding: 10px 15px; border-radius: 5px; font-weight: bold; cursor: pointer; margin-top: 10px; }
  </style>
</head>
<body>

  <!-- TABEL A: INPUT ORIGINAL -->
  <div class="card">
    <h3>Tabel A (Input Data Original)</h3>
    <table id="tabelA">
      <tr>
        <th>Nama Barang</th>
        <th>Harga Satuan (Rp)</th>
        <th>Jumlah (Qty)</th>
      </tr>
      <tr>
        <td><input type="text" class="input-nama" value="Aset Digital"></td>
        <td><input type="number" class="input-harga" value="100000"></td>
        <td><input type="number" class="input-qty" value="2"></td>
      </tr>
    </table>
    <button onclick="kirimKeWA()">Kirim Tabel B ke WA</button>
  </div>

  <!-- TABEL B: PENGOLAH DATA (Real-time) -->
  <div class="card">
    <h3>Tabel B (Hasil Pengolahan)</h3>
    <div id="areaTabelB" style="padding: 10px; background: white;">
      <table id="tabelB">
        <thead>
          <tr>
            <th>Deskripsi</th>
            <th>Total Harga (Rp)</th>
            <th>Status</th>
          </tr>
        </thead>
        <tbody>
          <tr>
            <td id="b-deskripsi">-</td>
            <td id="b-total">0</td>
            <td id="b-status">Proses</td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>

  <script>
    // Fungsi Hitung Real-time
    function hitungData() {
      const nama = document.querySelector('.input-nama').value;
      const harga = parseFloat(document.querySelector('.input-harga').value) || 0;
      const qty = parseFloat(document.querySelector('.input-qty').value) || 0;

      const total = harga * qty;

      document.getElementById('b-deskripsi').innerText = nama;
      document.getElementById('b-total').innerText = total.toLocaleString('id-ID');
      document.getElementById('b-status').innerText = total > 0 ? "Selesai Hitung" : "Pending";
    }

    // Jalankan perhitungan setiap ada input di Tabel A
    document.getElementById('tabelA').addEventListener('input', hitungData);
    
    // Hitung pertama kali saat halaman dimuat
    hitungData();

    // Fungsi Render Gambar & Buka WA
    function kirimKeWA() {
      const areaB = document.getElementById('areaTabelB');

      html2canvas(areaB).then(canvas => {
        // Generate Gambar PNG
        const link = document.createElement('a');
        link.download = 'Tabel_Hasil_Perhitungan.png';
        link.href = canvas.toDataURL('image/png');
        link.click();

        // Buka WhatsApp
        const nomorWA = "6281234567890"; // Ganti dengan nomor tujuan
        const pesan = encodeURIComponent("Halo, berikut hasil perhitungan Tabel B (Gambar telah terunduh otomatis, silakan lampirkan):");
        
        setTimeout(() => {
          window.open(`https://wa.me/${nomorWA}?text=${pesan}`, '_blank');
        }, 1000);
      });
    }
  </script>
</body>
</html>
