<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistem Quality Control RCT - Nusantara Edition</title>
    <style>
        :root {
            --bg-dark: #12100e;
            --card-bg: #1e1a17;
            --accent-gold: #d4af37;
            --accent-copper: #b87333;
            --text-light: #f5f0eb;
            --border-color: #3d3128;
            --header-bg: #2a221c;
            --green-accent: #2e7d32;
            --green-light: #4caf50;
            --red-alert: #c62828;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-light);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 15px;
            /* Pola Batik Megamendung/Kawung Halus SVG Background */
            background-image: radial-gradient(var(--accent-copper) 0.5px, transparent 0.5px), radial-gradient(var(--accent-gold) 0.5px, var(--bg-dark) 0.5px);
            background-size: 20px 20px;
            background-position: 0 0, 10px 10px;
            background-opacity: 0.1;
        }

        .container {
            width: 100%;
            max-width: 520px;
            background: var(--card-bg);
            border: 2px solid var(--accent-gold);
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8), 0 0 15px rgba(212, 175, 55, 0.2);
            overflow: hidden;
            position: relative;
        }

        /* Banner Batik Header */
        .header-banner {
            background: linear-gradient(135deg, #2a221c 0%, #4a3b2c 50%, #2a221c 100%);
            padding: 15px;
            text-align: center;
            border-bottom: 2px solid var(--accent-gold);
            position: relative;
        }

        .header-banner h2 {
            color: var(--accent-gold);
            font-size: 1.3rem;
            letter-spacing: 1px;
            text-transform: uppercase;
            text-shadow: 1px 1px 2px #000;
        }

        .header-banner p {
            font-size: 0.75rem;
            color: #ccc;
            margin-top: 2px;
        }

        /* Grid Table Form */
        .qc-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.85rem;
        }

        .qc-table td, .qc-table th {
            border: 1px solid var(--border-color);
            padding: 4px;
            text-align: center;
            vertical-align: middle;
        }

        .label-cell {
            background-color: var(--header-bg);
            color: var(--accent-gold);
            font-weight: bold;
        }

        input, select {
            width: 100%;
            padding: 6px;
            background-color: #2b2520;
            border: 1px solid var(--border-color);
            color: #fff;
            border-radius: 4px;
            text-align: center;
            font-weight: bold;
            outline: none;
        }

        input:focus, select:focus {
            border-color: var(--accent-gold);
            box-shadow: 0 0 5px rgba(212, 175, 55, 0.5);
        }

        .rct-header {
            background-color: #3b4d61;
            color: #fff;
            font-weight: bold;
        }

        /* Section Highlight Colors */
        .bg-green-main {
            background-color: #1b4332 !important;
            color: #2ec4b6;
        }

        .bg-green-status {
            background-color: #2d4a22 !important;
        }

        .read-only-val {
            background-color: #12100e;
            color: #ffd700;
            font-weight: bold;
            padding: 6px;
            border-radius: 4px;
            border: 1px solid #3d3128;
            display: block;
        }

        .status-val {
            font-weight: bold;
            color: #fff;
        }

        .status-rcl {
            color: #ff4d4d;
        }

        .fact-section {
            background-color: #1b4332;
            padding: 8px;
            text-align: center;
            border-top: 1px solid var(--border-color);
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
        }

        .fact-section label {
            font-weight: bold;
            color: #fff;
            font-size: 0.9rem;
        }

        .fact-section input {
            width: 80px;
            background-color: #0d2818;
            border: 1px solid var(--accent-gold);
            color: #fff;
            text-align: center;
        }

        /* Action Buttons */
        .btn-container {
            padding: 12px;
            background-color: var(--header-bg);
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .btn {
            border: none;
            padding: 10px 15px;
            font-weight: bold;
            font-size: 0.95rem;
            border-radius: 6px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: all 0.3s ease;
            text-transform: uppercase;
        }

        .btn-wa {
            background: linear-gradient(135deg, #25d366, #128c7e);
            color: white;
            box-shadow: 0 4px 10px rgba(37, 211, 102, 0.3);
        }

        .btn-wa:hover {
            background: linear-gradient(135deg, #20ba5a, #0e6b60);
            transform: translateY(-1px);
        }

        /* Responsive Mobile styling */
        @media (max-width: 480px) {
            .container {
                border-radius: 8px;
            }
            .qc-table td {
                padding: 3px;
            }
            input, select {
                font-size: 0.8rem;
                padding: 4px;
            }
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header-banner">
        <h2>Quality Control RCT</h2>
        <p>Sistem Kontrol Kualitas Produksi</p>
    </div>

    <table class="qc-table">
        <tr>
            <td class="label-cell" style="width: 18%;">GRADE:</td>
            <td style="width: 32%;">
                <select id="valA" onchange="calculate()">
                    <option value="CME">CME</option>
                    <option value="CMF">CMF</option>
                </select>
            </td>
            <td class="label-cell" style="width: 18%;">Check</td>
            <td style="width: 32%;">
                <select id="valCheck">
                    <option value="RCT">RCT</option>
                    <option value="CMT">CMT</option>
                </select>
            </td>
        </tr>
        <tr>
            <td class="label-cell">GSM:</td>
            <td>
                <select id="valB" onchange="calculate()">
                    <option value="110">110</option>
                    <option value="125">125</option>
                    <option value="135">135</option>
                    <option value="150">150</option>
                </select>
            </td>
            <td class="label-cell">Temp</td>
            <td><input type="number" id="valD" placeholder="Temp"></td>
        </tr>
        <tr>
            <td class="label-cell">JR:</td>
            <td><input type="text" id="valC" placeholder="No. JR"></td>
            <td class="label-cell">RH</td>
            <td><input type="number" id="valE" placeholder="RH"></td>
        </tr>
        
        <tr>
            <td class="rct-header" colspan="1">RCT</td>
            <td class="rct-header">TS</td>
            <td class="rct-header">MS</td>
            <td class="rct-header">DS</td>
        </tr>

        <tr>
            <td class="label-cell" rowspan="2">TOP<br>LUAR</td>
            <td class="label-cell" style="width: 5%;">1</td>
            <td rowspan="2"><input type="number" id="valF" oninput="calculate()" placeholder="F"></td>
            <td><input type="number" id="valI" oninput="calculate()" placeholder="I"></td>
            <td rowspan="2"><input type="number" id="valM" oninput="calculate()" placeholder="M"></td>
        </tr>
        <tr>
            <td class="label-cell">2</td>
            <td><input type="number" id="valJ" oninput="calculate()" placeholder="J"></td>
        </tr>

        <tr>
            <td class="label-cell" rowspan="2">BOTT<br>OM<br>LUAR</td>
            <td class="label-cell">3</td>
            <td><input type="number" id="valG" oninput="calculate()" placeholder="G"></td>
            <td><input type="number" id="valK" oninput="calculate()" placeholder="K"></td>
            <td><input type="number" id="valN" oninput="calculate()" placeholder="N"></td>
        </tr>
        <tr>
            <td class="label-cell">4</td>
            <td><input type="number" id="valH" oninput="calculate()" placeholder="H"></td>
            <td><input type="number" id="valL" oninput="calculate()" placeholder="L"></td>
            <td><input type="number" id="valO" oninput="calculate()" placeholder="O"></td>
        </tr>

        <tr class="bg-green-main">
            <td colspan="1" class="label-cell" style="background-color: #1b4332; color: #fff;">AVERAGE</td>
            <td><span id="valP" class="read-only-val">-</span></td>
            <td><span id="valQ" class="read-only-val">-</span></td>
            <td><span id="valR" class="read-only-val">-</span></td>
        </tr>
        <tr class="bg-green-main">
            <td colspan="4"><span id="valS" class="read-only-val">-</span></td>
        </tr>

        <tr>
            <td class="label-cell bg-green-status" rowspan="2" style="color:#fff;">STATUS</td>
            <td><span id="valT" class="status-val">-</span></td>
            <td><span id="valU" class="status-val">-</span></td>
            <td><span id="valV" class="status-val">-</span></td>
        </tr>
        <tr>
            <td><span id="valW" class="status-val">-</span></td>
            <td><span id="valX" class="status-val">-</span></td>
            <td><span id="valY" class="status-val">-</span></td>
        </tr>

        <tr>
            <td class="label-cell">MIN</td>
            <td colspan="3"><span id="valZ" class="read-only-val" style="color: #4caf50;">-</span></td>
        </tr>
    </table>

    <div class="fact-section">
        <label for="valFact">FACT</label>
        <input type="number" id="valFact" value="40" oninput="calculate()">
        <span style="color: #fff; font-weight: bold;">%</span>
    </div>

    <div class="btn-container">
        <button class="btn btn-wa" onclick="shareWhatsApp()">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="white"><path d="M.057 24l1.687-6.163c-1.041-1.804-1.588-3.849-1.587-5.946.003-6.556 5.338-11.891 11.893-11.891 3.181.001 6.167 1.24 8.413 3.488 2.245 2.248 3.481 5.236 3.48 8.414-.003 6.557-5.338 11.892-11.893 11.892-1.99-.001-3.951-.5-5.688-1.448l-6.305 1.654zm6.597-3.807c1.676.995 3.276 1.591 5.392 1.592 5.448 0 9.886-4.434 9.889-9.885.002-5.462-4.415-9.89-9.881-9.892-5.452 0-9.887 4.434-9.889 9.884-.001 2.225.651 3.891 1.746 5.634l-.999 3.648 3.742-.981z"/></svg>
            SHARE RCT VIA WA
        </button>
    </div>
</div>

<script>
    function getZValue(a, b) {
        if (a === 'CME' && b === '110') return 10.2;
        if (a === 'CME' && b === '125') return 12.5;
        if (a === 'CME' && b === '135') return 13.5;
        if (a === 'CME' && b === '150') return 15.0;
        if (a === 'CMF' && b === '125') return 11.5;
        if (a === 'CMF' && b === '150') return 13.9;
        return 0; // Default jika tidak sesuai kriteria
    }

    function calculate() {
        const a = document.getElementById('valA').value;
        const b = document.getElementById('valB').value;

        // Hitung Z
        const z = getZValue(a, b);
        document.getElementById('valZ').innerText = z ? z.toFixed(1) : '-';

        // Input Nilai
        const f = parseFloat(document.getElementById('valF').value) || 0;
        const g = parseFloat(document.getElementById('valG').value) || 0;
        const h = parseFloat(document.getElementById('valH').value) || 0;

        const i = parseFloat(document.getElementById('valI').value) || 0;
        const j = parseFloat(document.getElementById('valJ').value) || 0;
        const k = parseFloat(document.getElementById('valK').value) || 0;
        const l = parseFloat(document.getElementById('valL').value) || 0;

        const m = parseFloat(document.getElementById('valM').value) || 0;
        const n = parseFloat(document.getElementById('valN').value) || 0;
        const o = parseFloat(document.getElementById('valO').value) || 0;

        // Rata-rata P (F, G, H)
        const pArr = [f, g, h].filter(v => v > 0);
        const p = pArr.length > 0 ? (pArr.reduce((a, b) => a + b, 0) / pArr.length) : 0;
        document.getElementById('valP').innerText = p ? p.toFixed(2) : '-';

        // Rata-rata Q ( (I & J dirata-rata dulu), K, L )
        let ijAvg = 0;
        const ijArr = [i, j].filter(v => v > 0);
        if(ijArr.length > 0) ijAvg = ijArr.reduce((a, b) => a + b, 0) / ijArr.length;

        const qSubArr = [];
        if(ijAvg > 0) qSubArr.push(ijAvg);
        if(k > 0) qSubArr.push(k);
        if(l > 0) qSubArr.push(l);

        const q = qSubArr.length > 0 ? (qSubArr.reduce((a, b) => a + b, 0) / qSubArr.length) : 0;
        document.getElementById('valQ').innerText = q ? q.toFixed(2) : '-';

        // Rata-rata R (M, N, O)
        const rArr = [m, n, o].filter(v => v > 0);
        const r = rArr.length > 0 ? (rArr.reduce((a, b) => a + b, 0) / rArr.length) : 0;
        document.getElementById('valR').innerText = r ? r.toFixed(2) : '-';

        // Rata-rata S (P, Q, R)
        const sArr = [p, q, r].filter(v => v > 0);
        const s = sArr.length > 0 ? (sArr.reduce((a, b) => a + b, 0) / sArr.length) : 0;
        document.getElementById('valS').innerText = s ? s.toFixed(2) : '-';

        // Evaluasi Logika T, U, V
        setStatus('valT', p > 0 && p < z ? 'RCL' : '-');
        setStatus('valU', q > 0 && q < z ? 'RCL' : '-');
        setStatus('valV', r > 0 && r < z ? 'RCL' : '-');

        // Evaluasi Logika W, X, Y
        setStatus('valW', p > 0 ? (p < z ? 'QW' : 'Q1') : '-');
        setStatus('valX', q > 0 ? (q < z ? 'QW' : 'Q1') : '-');
        setStatus('valY', r > 0 ? (r < z ? 'QW' : 'Q1') : '-');
    }

    function setStatus(elementId, text) {
        const el = document.getElementById(elementId);
        el.innerText = text;
        if (text === 'RCL' || text === 'QW') {
            el.className = 'status-val status-rcl';
        } else {
            el.className = 'status-val';
        }
    }

    function shareWhatsApp() {
        const grade = document.getElementById('valA').value;
        const gsm = document.getElementById('valB').value;
        const jr = document.getElementById('valC').value || '-';
        const check = document.getElementById('valCheck').value;
        const temp = document.getElementById('valD').value || '-';
        const rh = document.getElementById('valE').value || '-';
        
        const p = document.getElementById('valP').innerText;
        const q = document.getElementById('valQ').innerText;
        const r = document.getElementById('valR').innerText;
        const s = document.getElementById('valS').innerText;
        const min = document.getElementById('valZ').innerText;
        const fact = document.getElementById('valFact').value;

        const text = `*LAPORAN QUALITY CONTROL ${check}*%0A` +
            `----------------------------------%0A` +
            `*GRADE:* ${grade}%0A` +
            `*GSM:* ${gsm}%0A` +
            `*No. JR:* ${jr}%0A` +
            `*Temp/RH:* ${temp}°C / ${rh}%%0A` +
            `----------------------------------%0A` +
            `*AVERAGE RESULT:*%0A` +
            `• TS (P): ${p}%0A` +
            `• MS (Q): ${q}%0A` +
            `• DS (R): ${r}%0A` +
            `• TOTAL (S): ${s}%0A` +
            `----------------------------------%0A` +
            `*MIN TARGET (Z):* ${min}%0A` +
            `*FACT:* ${fact}%%0A` +
            `----------------------------------%0A` +
            `_Dikirim otomatis via Sistem QC Nusantara_`;

        window.open(`https://api.whatsapp.com/send?text=${text}`, '_blank');
    }

    // Run initial calculation on load
    calculate();
</script>

</body>
</html>
