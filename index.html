<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aplikasi Pengujian Kertas - Nusantara Quality Control</title>
  <style>
    :root {
      --batik-brown: #3d2314;
      --batik-gold: #c59b27;
      --batik-cream: #fbf8f3;
      --batik-light-gold: #e6cb7a;
      --border-color: #8c6d3f;
      --success-green: #2e7d32;
      --danger-red: #c62828;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #f4efe6;
      background-image: radial-gradient(var(--batik-light-gold) 0.75px, transparent 0.75px), radial-gradient(var(--batik-light-gold) 0.75px, #f4efe6 0.75px);
      background-size: 30px 30px;
      background-position: 0 0, 15px 15px;
      margin: 0;
      padding: 20px;
      color: #333;
    }

    .container {
      max-width: 750px;
      margin: 0 auto;
      background: var(--batik-cream);
      border: 3px solid var(--batik-gold);
      border-radius: 8px;
      box-shadow: 0 8px 20px rgba(61, 35, 20, 0.2);
      overflow: hidden;
    }

    .header {
      background: linear-gradient(135deg, var(--batik-brown), #5a351e);
      color: #fff;
      text-align: center;
      padding: 20px;
      border-bottom: 4px solid var(--batik-gold);
      position: relative;
    }

    .header h1 {
      margin: 0;
      font-size: 1.5rem;
      letter-spacing: 1px;
      color: var(--batik-gold);
      text-transform: uppercase;
    }

    .header p {
      margin: 5px 0 0;
      font-size: 0.85rem;
      opacity: 0.9;
    }

    .sheet-wrapper {
      padding: 20px;
      overflow-x: auto;
    }

    table.excel-table {
      border-collapse: collapse;
      width: 100%;
      background-color: #fff;
      border: 2px solid var(--border-color);
    }

    table.excel-table th, table.excel-table td {
      border: 1px solid var(--border-color);
      padding: 6px 8px;
      font-size: 0.9rem;
      text-align: center;
    }

    table.excel-table th {
      background-color: var(--batik-brown);
      color: #fff;
      font-weight: 600;
    }

    .col-header {
      background-color: #e2d2b4 !important;
      color: var(--batik-brown) !important;
      font-weight: bold;
    }

    .row-header {
      background-color: #f2e7d3;
      font-weight: bold;
      color: var(--batik-brown);
    }

    input, select {
      width: 100%;
      box-sizing: border-box;
      padding: 6px;
      border: 1px solid #ccc;
      border-radius: 3px;
      text-align: center;
      font-size: 0.9rem;
      background-color: #fff;
    }

    input:focus, select:focus {
      outline: 2px solid var(--batik-gold);
      border-color: transparent;
    }

    input[readonly] {
      background-color: #f0f0f0;
      font-weight: bold;
      color: #333;
    }

    .merged-result {
      background-color: #fdf3d6 !important;
      font-weight: bold;
      font-size: 1.1rem;
      color: var(--batik-brown);
    }

    .status-box {
      font-weight: bold;
      font-size: 1rem;
      padding: 8px;
      border-radius: 4px;
    }

    .status-pass {
      background-color: #e8f5e9;
      color: var(--success-green);
      border: 1px solid var(--success-green);
    }

    .status-fail {
      background-color: #ffebee;
      color: var(--danger-red);
      border: 1px solid var(--danger-red);
    }

    .info-footer {
      background-color: #f2e7d3;
      padding: 12px 20px;
      border-top: 1px solid var(--border-color);
      font-size: 0.8rem;
      color: var(--batik-brown);
      display: flex;
      justify-content: space-between;
    }
  </style>
</head>
<body>

<div class="container">
  <div class="header">
    <h1>Sistem Pengujian Mutu Kertas</h1>
    <p>Pengujian RCT, CMT & CMT (L&W)</p>
  </div>

  <div class="sheet-wrapper">
    <table class="excel-table">
      <thead>
        <tr>
          <th style="width: 8%;">Cell</th>
          <th style="width: 18%;" class="col-header">A</th>
          <th style="width: 10%;" class="col-header">B</th>
          <th style="width: 28%;" class="col-header">C</th>
          <th style="width: 18%;" class="col-header">D</th>
          <th style="width: 18%;" class="col-header">E</th>
        </tr>
      </thead>
      <tbody>
        <!-- Row 1 -->
        <tr>
          <td class="row-header">1</td>
          <td class="row-header">CHECK</td>
          <td></td>
          <td>
            <select id="cellC1" onchange="calculate()">
              <option value="RCT">RCT</option>
              <option value="CMT">CMT</option>
              <option value="CMT(L&W)">CMT(L&W)</option>
            </select>
          </td>
          <td class="row-header">K</td>
          <td><input type="number" id="cellE1" value="0.4" step="0.01" oninput="calculate()"></td>
        </tr>

        <!-- Row 2 -->
        <tr>
          <td class="row-header">2</td>
          <td class="row-header">GRADE</td>
          <td></td>
          <td>
            <select id="cellC2" onchange="calculate()">
              <option value="CME 110">CME 110</option>
              <option value="CME 125" selected>CME 125</option>
              <option value="CME 135">CME 135</option>
              <option value="CME 150">CME 150</option>
              <option value="CMF 125">CMF 125</option>
              <option value="CMF 150">CMF 150</option>
            </select>
          </td>
          <td class="row-header">Temp</td>
          <td><input type="number" id="cellE2" placeholder="°C"></td>
        </tr>

        <!-- Row 3 -->
        <tr>
          <td class="row-header">3</td>
          <td class="row-header">NO: JR</td>
          <td></td>
          <td><input type="text" id="cellC3" placeholder="No. Roll"></td>
          <td class="row-header">RH</td>
          <td><input type="number" id="cellE3" placeholder="%"></td>
        </tr>

        <!-- Row 4 (Table Headers) -->
        <tr style="background-color: #f2e7d3;">
          <td class="row-header">4</td>
          <td colspan="2"></td>
          <td style="font-weight: bold; color: var(--batik-brown);">TS</td>
          <td style="font-weight: bold; color: var(--batik-brown);">MS</td>
          <td style="font-weight: bold; color: var(--batik-brown);">DS</td>
        </tr>

        <!-- Row 5 -->
        <tr>
          <td class="row-header">5</td>
          <td rowspan="2" class="row-header" style="vertical-align: middle;">TOP LUAR</td>
          <td class="row-header">1</td>
          <td rowspan="2" style="vertical-align: middle;">
            <input type="number" id="cellC5_6" placeholder="C5:C6" oninput="calculate()">
          </td>
          <td><input type="number" id="cellD5" oninput="calculate()"></td>
          <td rowspan="2" style="vertical-align: middle;">
            <input type="number" id="cellE5_6" placeholder="E5:E6" oninput="calculate()">
          </td>
        </tr>

        <!-- Row 6 -->
        <tr>
          <td class="row-header">6</td>
          <td class="row-header">2</td>
          <td><input type="number" id="cellD6" oninput="calculate()"></td>
        </tr>

        <!-- Row 7 -->
        <tr>
          <td class="row-header">7</td>
          <td rowspan="2" class="row-header" style="vertical-align: middle;">BOTTOM LUAR</td>
          <td class="row-header">3</td>
          <td><input type="number" id="cellC7" oninput="calculate()"></td>
          <td><input type="number" id="cellD7" oninput="calculate()"></td>
          <td><input type="number" id="cellE7" oninput="calculate()"></td>
        </tr>

        <!-- Row 8 -->
        <tr>
          <td class="row-header">8</td>
          <td class="row-header">4</td>
          <td><input type="number" id="cellC8" oninput="calculate()"></td>
          <td><input type="number" id="cellD8" oninput="calculate()"></td>
          <td><input type="number" id="cellE8" oninput="calculate()"></td>
        </tr>

        <!-- Row 9 -->
        <tr>
          <td class="row-header">9</td>
          <td colspan="2" class="row-header">AVERAGE</td>
          <td><input type="text" id="cellC9" readonly class="merged-result"></td>
          <td><input type="text" id="cellD9" readonly class="merged-result"></td>
          <td><input type="text" id="cellE9" readonly class="merged-result"></td>
        </tr>

        <!-- Row 10 -->
        <tr>
          <td class="row-header">10</td>
          <td colspan="2" class="row-header">TOTAL AVERAGE</td>
          <td colspan="3"><input type="text" id="cellC10_E10" readonly class="merged-result" style="font-size: 1.2rem;"></td>
        </tr>

        <!-- Row 11-12 (Status) -->
        <tr>
          <td class="row-header">11-12</td>
          <td colspan="2" class="row-header" style="vertical-align: middle;">STATUS</td>
          <td colspan="3" style="vertical-align: middle;">
            <div id="statusBox" class="status-box">-</div>
          </td>
        </tr>
      </tbody>
    </table>
  </div>

  <div class="info-footer">
    <span>Batas Minimal (<span id="gradeDisplay">CME 125</span>): <strong id="minDisplay">12.5</strong></span>
    <span>Sistem Pengujian Kertas QC</span>
  </div>
</div>

<script>
  // Pemetaan Standar Minimal Berdasarkan Grade
  const minStandards = {
    "CME 110": 10.2,
    "CME 125": 12.5,
    "CME 135": 13.5,
    "CME 150": 15.0,
    "CMF 125": 11.5,
    "CMF 150": 13.8
  };

  function getVal(id) {
    const val = parseFloat(document.getElementById(id).value);
    return isNaN(val) ? 0 : val;
  }

  function calculate() {
    // 1. C9 = Average(C5:C8) -> C5 dan C6 termerger di input C5_6
    const c56 = getVal('cellC5_6');
    const c7 = getVal('cellC7');
    const c8 = getVal('cellC8');
    const c9 = (c56 + c7 + c8) / 3;
    document.getElementById('cellC9').value = c9 ? c9.toFixed(2) : '-';

    // 2. D9 = (((D5+D6)/2)+D7+D8)/3
    const d5 = getVal('cellD5');
    const d6 = getVal('cellD6');
    const d7 = getVal('cellD7');
    const d8 = getVal('cellD8');
    const d9 = (((d5 + d6) / 2) + d7 + d8) / 3;
    document.getElementById('cellD9').value = d9 ? d9.toFixed(2) : '-';

    // 3. E9 = Average(E5:E8) -> E5 dan E6 termerger di input E5_6
    const e56 = getVal('cellE5_6');
    const e7 = getVal('cellE7');
    const e8 = getVal('cellE8');
    const e9 = (e56 + e7 + e8) / 3;
    document.getElementById('cellE9').value = e9 ? e9.toFixed(2) : '-';

    // 4. C10:E10 = Average(C9:E9)
    let totalAvg = 0;
    let count = 0;
    if (c9) { totalAvg += c9; count++; }
    if (d9) { totalAvg += d9; count++; }
    if (e9) { totalAvg += e9; count++; }

    const finalAvg = count > 0 ? (totalAvg / count) : 0;
    document.getElementById('cellC10_E10').value = finalAvg ? finalAvg.toFixed(2) : '-';

    // 5. Evaluasi Status berdasarkan Grade
    const selectedGrade = document.getElementById('cellC2').value;
    const minRequirement = minStandards[selectedGrade] || 0;

    document.getElementById('gradeDisplay').innerText = selectedGrade;
    document.getElementById('minDisplay').innerText = minRequirement;

    const statusBox = document.getElementById('statusBox');
    if (finalAvg > 0) {
      if (finalAvg >= minRequirement) {
        statusBox.innerText = `PASSED (≥ ${minRequirement})`;
        statusBox.className = "status-box status-pass";
      } else {
        statusBox.innerText = `FAILED (< ${minRequirement})`;
        statusBox.className = "status-box status-fail";
      }
    } else {
      statusBox.innerText = "-";
      statusBox.className = "status-box";
    }
  }

  // Jalankan kalkulasi awal
  calculate();
</script>

</body>
</html>
