<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Perhitungan RCT & CMT</title>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

  <style>
    :root {
      --bg-primary: #0f172a;
      --bg-card: #1e293b;
      --bg-input: #334155;
      --accent: #38bdf8;
      --text-main: #f8fafc;
      --text-muted: #cbd5e1;
      --border-color: #475569;
      --excel-header-bg: #7ea6e0;
      --excel-avg-bg: #00e600;
      --excel-status-bg: #8ce600;
      --danger-bg: #ef4444;
      --danger-text: #dc2626;
      --wa-green: #25d366;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--bg-primary);
      color: var(--text-main);
      display: flex;
      justify-content: center;
      min-height: 100vh;
      padding: 10px;
    }

    .app-container {
      width: 100%;
      max-width: 440px;
      background: var(--bg-card);
      border-radius: 20px;
      padding: 18px;
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5);
      border: 1px solid rgba(255, 255, 255, 0.1);
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .app-header {
      text-align: center;
      border-bottom: 2px solid var(--border-color);
      padding-bottom: 10px;
    }

    .app-header h1 {
      font-size: 1.4rem;
      font-weight: 800;
      color: var(--accent);
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .action-bar {
      display: flex;
      gap: 10px;
      align-items: center;
    }

    .mode-selector-wrapper {
      flex: 1;
      background: var(--bg-input);
      border-radius: 12px;
      padding: 8px 12px;
      border: 1.5px solid var(--border-color);
    }

    .mode-selector-wrapper label {
      display: block;
      font-size: 0.8rem;
      color: #94a3b8;
      text-transform: uppercase;
      margin-bottom: 4px;
      font-weight: 700;
    }

    .mode-select {
      width: 100%;
      background: transparent;
      color: var(--text-main);
      border: none;
      font-size: 1.1rem;
      font-weight: 700;
      outline: none;
      cursor: pointer;
    }

    .mode-select option {
      background-color: var(--bg-card);
      color: var(--text-main);
      font-size: 1.1rem;
    }

    .btn-reset {
      background: #dc2626;
      color: white;
      border: none;
      border-radius: 12px;
      padding: 0 16px;
      height: 100%;
      min-height: 54px;
      font-weight: 800;
      font-size: 0.95rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.2s;
    }

    .btn-reset:active {
      background: #b91c1c;
    }

    .btn-wa {
      background: var(--wa-green);
      color: #ffffff;
      border: none;
      border-radius: 10px;
      padding: 12px;
      width: 100%;
      font-size: 1rem;
      font-weight: 800;
      cursor: pointer;
      margin-top: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.2);
      transition: background 0.2s, transform 0.1s;
    }

    .btn-wa:active {
      background: #1da851;
      transform: scale(0.98);
    }

    .view-section {
      display: none;
      flex-direction: column;
      gap: 16px;
    }

    .view-section.active {
      display: flex;
    }

    .card {
      background: rgba(15, 23, 42, 0.7);
      border-radius: 14px;
      padding: 14px;
      border: 1px solid rgba(255, 255, 255, 0.1);
    }

    .card-title {
      font-size: 1.15rem;
      font-weight: 800;
      color: var(--accent);
      margin-bottom: 12px;
      text-transform: uppercase;
    }

    .grid-2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    .grid-3 {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 10px;
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .form-group label {
      font-size: 0.85rem;
      font-weight: 700;
      color: var(--text-muted);
    }

    .form-control {
      background: var(--bg-input);
      border: 1.5px solid var(--border-color);
      border-radius: 8px;
      padding: 10px;
      color: var(--text-main);
      font-size: 1.1rem;
      font-weight: 700;
      outline: none;
      width: 100%;
      text-align: center;
    }

    .form-control[readonly] {
      background: rgba(51, 65, 85, 0.5);
      color: #f1f5f9;
    }

    .table-container {
      width: 100%;
      overflow-x: auto;
    }

    table.excel-table {
      width: 100%;
      border-collapse: collapse;
      color: #000;
      background-color: #fff;
      font-weight: bold;
    }

    table.excel-table th, table.excel-table td {
      border: 2px solid #000;
      text-align: center;
      vertical-align: middle;
      padding: 6px 4px;
      font-size: 1.1rem;
    }

    table.excel-table th.header-type {
      background-color: var(--excel-header-bg);
      font-size: 1.25rem;
      font-weight: 800;
    }

    table.excel-table th.header-col {
      background-color: #fff;
      font-size: 1.15rem;
      font-weight: 800;
    }

    table.excel-table td.cell-avg {
      background-color: var(--excel-avg-bg);
      font-size: 1.15rem;
      font-weight: 800;
    }

    table.excel-table td.cell-status {
      background-color: var(--excel-status-bg);
      font-size: 1.15rem;
      font-weight: 800;
    }

    table.excel-table input {
      width: 100%;
      height: 100%;
      border: none;
      background: transparent;
      text-align: center;
      font-size: 1.15rem;
      font-weight: 800;
      color: #000;
      outline: none;
      padding: 6px 0;
    }

    /* Kelas khusus untuk nilai melebihi batas (Merah) */
    .text-red {
      color: var(--danger-text) !important;
    }

    /* Kelas khusus untuk status QW (Blok Merah) */
    .bg-red-qw {
      background-color: var(--danger-bg) !important;
      color: #ffffff !important;
    }

    .footer-info {
      text-align: center;
      font-size: 0.85rem;
      color: var(--text-muted);
      margin-top: auto;
      font-weight: 600;
    }
  </style>
</head>
<body>

<div class="app-container">
  <div class="app-header">
    <h1>Kalkulator RCT & CMT</h1>
  </div>

  <div class="action-bar">
    <div class="mode-selector-wrapper">
      <label for="viewMode">Pilihan Tampilan</label>
      <select id="viewMode" class="mode-select" onchange="switchView(this.value)">
        <option value="input-rct">Input data RCT</option>
        <option value="input-cmt">Input data CMT</option>
        <option value="upload-rct">Upload data RCT</option>
        <option value="upload-cmt">Upload data CMT</option>
      </select>
    </div>
    <button type="button" class="btn-reset" onclick="clearAllInputs()" title="Reset Isian Data">Reset</button>
  </div>

  <div id="view-input-rct" class="view-section active">
    <div class="card">
      <div class="card-title">Parameter RCT</div>
      <div class="grid-3">
        <div class="form-group">
          <label>GRADE</label>
          <select id="rct_d2" class="form-control" onchange="syncAndRecalculate()">
            <option value="CME">CME</option>
            <option value="CMF">CMF</option>
          </select>
        </div>
        <div class="form-group">
          <label>GSM</label>
          <select id="rct_d3" class="form-control" onchange="syncAndRecalculate()">
            <option value="110">110</option>
            <option value="125">125</option>
            <option value="135">135</option>
            <option value="150">150</option>
          </select>
        </div>
        <div class="form-group">
          <label>JR</label>
          <input type="number" id="rct_d4" class="form-control" value="" placeholder="0.4" step="0.1" inputmode="decimal" onfocus="this.select()" oninput="syncAndRecalculate()">
        </div>
      </div>
      <div class="grid-3" style="margin-top: 10px;">
        <div class="form-group">
          <label>FAKTOR (F2)</label>
          <input type="number" id="rct_f2" class="form-control" value="0.4" step="0.01" inputmode="decimal" onfocus="this.select()" oninput="syncAndRecalculate()">
        </div>
        <div class="form-group">
          <label>TEMP</label>
          <input type="text" id="rct_f3" class="form-control" value="" onfocus="this.select()" oninput="syncAndRecalculate()">
        </div>
        <div class="form-group">
          <label>RH</label>
          <input type="text" id="rct_f4" class="form-control" value="" onfocus="this.select()" oninput="syncAndRecalculate()">
        </div>
      </div>
    </div>

    <div class="card">
      <div class="table-container">
        <table class="excel-table">
          <thead>
            <tr>
              <th colspan="2" class="header-type">RCT</th>
              <th class="header-col">TS</th>
              <th class="header-col">MS</th>
              <th class="header-col">DS</th>
            </tr>
          </thead>
          <tbody>
            <tr>
              <td rowspan="2">TOP<br><br>LUAR</td>
              <td>1</td>
              <td rowspan="2"><input type="number" id="rct_d7" step="any" inputmode="decimal" onfocus="this.select()" oninput="recalculate()"></td>
              <td><input type="number" id="rct_e7" step="any" inputmode="decimal" onfocus="this.select()" oninput="recalculate()"></td>
              <td rowspan="2"><input type="number" id="rct_f7" step="any" inputmode="decimal" onfocus="this.select()" oninput="recalculate()"></td>
            </tr>
            <tr>
              <td>2</td>
              <td><input type="number" id="rct_e8" step="any" inputmode="decimal" onfocus="this.select()" oninput="recalculate()"></td>
            </tr>
            <tr>
              <td rowspan="2">BOTT<br>OM<br>LUAR</td>
              <td>3</td>
              <td><input type="number" id="rct_d9" step="any" inputmode="decimal" onfocus="this.select()" oninput="recalculate()"></td>
              <td><input type="number" id="rct_e9" step="any" inputmode="decimal" onfocus="this.select()" oninput="recalculate()"></td>
              <td><input type="number" id="rct_f9" step="any" inputmode="decimal" onfocus="this.select()" oninput="recalculate()"></td>
            </tr>
            <tr>
              <td>4</td>
              <td><input type="number" id="rct_d10" step="any" inputmode="decimal" onfocus="this.select()" oninput="recalculate()"></td>
              <td><input type="number" id="rct_e10" step="any" inputmode="decimal" onfocus="this.select()" oninput="recalculate()"></td>
              <td><input type="number" id="rct_f10" step="any" inputmode="decimal" onfocus="this.select()" oninput="recalculate()"></td>
            </tr>
            <tr>
              <td colspan="2" rowspan="2" class="cell-avg">AVERAGE</td>
              <td class="cell-avg" id="out_d11">-</td>
              <td class="cell-avg" id="out_e11">-</td>
              <td class="cell-avg" id="out_f11">-</td>
            </tr>
            <tr>
              <td colspan="3" class="cell-avg" id="out_d12">-</td>
            </tr>
            <tr>
              <td colspan="2" rowspan="2" class="cell-status">STATUS</td>
              <td class="cell-status" id="out_d13">-</td>
              <td class="cell-status" id="out_e13">-</td>
              <td class="cell-status" id="out_f13">-</td>
            </tr>
            <tr>
              <td class="cell-status" id="out_d14">-</td>
              <td class="cell-status" id="out_e14">-</td>
              <td class="cell-status" id="out_f14">-</td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>

  <div id="view-input-cmt" class="view-section">
    <div class="card">
      <div class="card-title">Parameter CMT</div>
      <div class="grid-3">
        <div class="form-group">
          <label>GRADE</label>
          <input type="text" id="cmt_d2_show" class="form-control" readonly>
        </div>
        <div class="form-group">
          <label>GSM</label>
          <input type="text" id="cmt_d3_show" class="form-control" readonly>
        </div>
        <div class="form-group">
          <label>JR</label>
          <input type="text" id="cmt_d4_show" class="form-control" readonly>
        </div>
      </div>
    </div>

    <div class="card">
      <div class="table-container">
        <table class="excel-table">
          <thead>
            <tr>
              <th colspan="2" class="header-type">CMT</th>
              <th class="header-col">TS</th>
              <th class="header-col">MS</th>
              <th class="header-col">DS</th>
            </tr>
          </thead>
          <tbody>
            <tr>
              <td rowspan="2">TOP<br><br>LUAR</td>
              <td>1</td>
              <td rowspan="2"><input type="number" id="cmt_d17" step="any" inputmode="decimal" onfocus="this.select()" oninput="recalculate()"></td>
              <td><input type="number" id="cmt_e17" step="any" inputmode="decimal" onfocus="this.select()" oninput="recalculate()"></td>
              <td rowspan="2"><input type="number" id="cmt_f17" step="any" inputmode="decimal" onfocus="this.select()" oninput="recalculate()"></td>
            </tr>
            <tr>
              <td>2</td>
              <td><input type="number" id="cmt_e18" step="any" inputmode="decimal" onfocus="this.select()" oninput="recalculate()"></td>
            </tr>
            <tr>
              <td rowspan="2">BOTT<br>OM<br>LUAR</td>
              <td>3</td>
              <td><input type="number" id="cmt_d19" step="any" inputmode="decimal" onfocus="this.select()" oninput="recalculate()"></td>
              <td><input type="number" id="cmt_e19" step="any" inputmode="decimal" onfocus="this.select()" oninput="recalculate()"></td>
              <td><input type="number" id="cmt_f19" step="any" inputmode="decimal" onfocus="this.select()" oninput="recalculate()"></td>
            </tr>
            <tr>
              <td>4</td>
              <td><input type="number" id="cmt_d20" step="any" inputmode="decimal" onfocus="this.select()" oninput="recalculate()"></td>
              <td><input type="number" id="cmt_e20" step="any" inputmode="decimal" onfocus="this.select()" oninput="recalculate()"></td>
              <td><input type="number" id="cmt_f20" step="any" inputmode="decimal" onfocus="this.select()" oninput="recalculate()"></td>
            </tr>
            <tr>
              <td colspan="2" rowspan="2" class="cell-avg">AVERAGE</td>
              <td class="cell-avg" id="out_d21">-</td>
              <td class="cell-avg" id="out_e21">-</td>
              <td class="cell-avg" id="out_f21">-</td>
            </tr>
            <tr>
              <td colspan="3" class="cell-avg" id="out_d22">-</td>
            </tr>
            <tr>
              <td colspan="2" rowspan="2" class="cell-status">STATUS</td>
              <td class="cell-status" id="out_d23">-</td>
              <td class="cell-status" id="out_e23">-</td>
              <td class="cell-status" id="out_f23">-</td>
            </tr>
            <tr>
              <td class="cell-status" id="out_d24">-</td>
              <td class="cell-status" id="out_e24">-</td>
              <td class="cell-status" id="out_f24">-</td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>

  <div id="view-upload-rct" class="view-section">
    <div class="card" id="card-upload-rct">
      <div class="card-title" id="title_upload_rct">RCT  JR:</div>
      <div class="grid-2" style="margin-bottom: 10px;">
        <div class="form-group">
          <label>TEMP</label>
          <input type="text" id="up_rct_n3" class="form-control" readonly>
        </div>
        <div class="form-group">
          <label>RH</label>
          <input type="text" id="up_rct_n4" class="form-control" readonly>
        </div>
      </div>
      <div class="table-container">
        <table class="excel-table">
          <thead>
            <tr>
              <th colspan="2" class="header-type">RCT</th>
              <th class="header-col">TS</th>
              <th class="header-col">MS</th>
              <th class="header-col">DS</th>
            </tr>
          </thead>
          <tbody>
            <tr>
              <td rowspan="2">TOP<br><br>LUAR</td>
              <td>1</td>
              <td rowspan="2"><input type="text" id="up_rct_l7" readonly></td>
              <td><input type="text" id="up_rct_m7" readonly></td>
              <td rowspan="2"><input type="text" id="up_rct_n7" readonly></td>
            </tr>
            <tr>
              <td>2</td>
              <td><input type="text" id="up_rct_m8" readonly></td>
            </tr>
            <tr>
              <td rowspan="2">BOTT<br>OM<br>LUAR</td>
              <td>3</td>
              <td><input type="text" id="up_rct_l9" readonly></td>
              <td><input type="text" id="up_rct_m9" readonly></td>
              <td><input type="text" id="up_rct_n9" readonly></td>
            </tr>
            <tr>
              <td>4</td>
              <td><input type="text" id="up_rct_l10" readonly></td>
              <td><input type="text" id="up_rct_m10" readonly></td>
              <td><input type="text" id="up_rct_n10" readonly></td>
            </tr>
            <tr>
              <td colspan="2" rowspan="2" class="
