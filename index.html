<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KALKULATOR RCT & CMT</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-white min-h-screen flex items-center justify-center p-4">

  <div class="w-full max-w-md bg-slate-900 border border-slate-800 rounded-2xl p-4 shadow-xl">
    
    <!-- Header Title -->
    <div class="text-center mb-4">
      <h1 class="text-xl font-bold text-sky-400 tracking-wide">KALKULATOR RCT & CMT</h1>
    </div>

    <!-- Mode Selector & Reset -->
    <div class="bg-slate-800/60 p-3 rounded-xl mb-4 border border-slate-700/50 flex items-center justify-between gap-2">
      <div class="flex-1">
        <label class="block text-[10px] text-amber-400 font-semibold mb-1">PILIHAN TAMPILAN</label>
        <select id="modeView" onchange="calculateAll()" class="w-full bg-slate-900 text-white text-sm font-semibold p-2 rounded-lg border border-slate-700 focus:outline-none">
          <option value="input">Input Data RCT</option>
          <option value="upload">Laporan RCT-CMT</option>
        </select>
      </div>
      <button onclick="resetForm()" class="mt-4 bg-red-600 hover:bg-red-700 text-white font-bold px-4 py-2 rounded-lg text-sm">
        Reset
      </button>
    </div>

    <!-- Parameter Section -->
    <div class="bg-slate-800/40 p-3 rounded-xl mb-4 border border-slate-700/40">
      <h2 class="text-xs font-bold text-amber-500 mb-2 tracking-wider">PARAMETER RCT</h2>
      <div class="grid grid-cols-3 gap-2">
        
        <!-- Pilihan Tool -->
        <div>
          <label class="block text-[10px] text-slate-400 mb-1">TOOL</label>
          <select id="tool" class="w-full bg-slate-900 text-white text-xs p-2 rounded border border-slate-700 font-bold">
            <option value="L&W">L&W</option>
            <option value="PNSHAR">PNSHAR</option>
          </select>
        </div>

        <div>
          <label class="block text-[10px] text-slate-400 mb-1">GRADE</label>
          <select id="grade" class="w-full bg-slate-900 text-white text-xs p-2 rounded border border-slate-700 font-bold">
            <option value="CME">CME</option>
            <option value="CMF">CMF</option>
          </select>
        </div>

        <div>
          <label class="block text-[10px] text-slate-400 mb-1">GSM</label>
          <select id="gsm" class="w-full bg-slate-900 text-white text-xs p-2 rounded border border-slate-700 font-bold">
            <option value="125">125</option>
            <option value="150">150</option>
          </select>
        </div>

        <!-- Faktor (F2) dalam % -->
        <div>
          <label class="block text-[10px] text-slate-400 mb-1">FAKTOR F2 (%)</label>
          <input type="number" id="faktor" value="40" oninput="calculateAll()" class="w-full bg-slate-900 text-white text-xs p-2 rounded border border-slate-700 font-bold text-center">
        </div>

        <div>
          <label class="block text-[10px] text-slate-400 mb-1">MIN RCT</label>
          <input type="number" id="minRct" value="11.6" step="0.1" oninput="calculateAll()" class="w-full bg-slate-900 text-white text-xs p-2 rounded border border-slate-700 font-bold text-center">
        </div>

        <div>
          <label class="block text-[10px] text-slate-400 mb-1">TEMP / RH</label>
          <div class="flex gap-1">
            <input type="number" id="temp" value="22.1" class="w-1/2 bg-slate-900 text-white text-[10px] p-1 rounded border border-slate-700 text-center">
            <input type="number" id="rh" value="49" class="w-1/2 bg-slate-900 text-white text-[10px] p-1 rounded border border-slate-700 text-center">
          </div>
        </div>

      </div>
    </div>

    <!-- Table Input Data -->
    <div class="overflow-x-auto bg-white rounded-xl text-black p-2">
      <table class="w-full border-collapse text-center text-xs font-bold">
        <thead>
          <tr class="bg-blue-200">
            <th class="border border-slate-400 p-2">RCT</th>
            <th class="border border-slate-400 p-2">TS</th>
            <th class="border border-slate-400 p-2">MS</th>
            <th class="border border-slate-400 p-2">DS</th>
          </tr>
        </thead>
        <tbody>
          <tr>
            <td rowspan="2" class="border border-slate-400 bg-slate-100 text-[10px]">TOP LUAR<br>1 & 2</td>
            <td class="border border-slate-400 p-1"><input type="number" id="ts1" oninput="calculateAll()" class="w-full text-center border-none focus:outline-none" placeholder="-"></td>
            <td class="border border-slate-400 p-1"><input type="number" id="ms1" oninput="calculateAll()" class="w-full text-center border-none focus:outline-none" placeholder="-"></td>
            <td rowspan="2" class="border border-slate-400 p-1"><input type="number" id="ds1" oninput="calculateAll()" class="w-full text-center border-none focus:outline-none" placeholder="-"></td>
          </tr>
          <tr>
            <td class="border border-slate-400 p-1"><input type="number" id="ts2" oninput="calculateAll()" class="w-full text-center border-none focus:outline-none" placeholder="-"></td>
            <td class="border border-slate-400 p-1"><input type="number" id="ms2" oninput="calculateAll()" class="w-full text-center border-none focus:outline-none" placeholder="-"></td>
          </tr>
          <tr>
            <td rowspan="2" class="border border-slate-400 bg-slate-100 text-[10px]">BOTTOM LUAR<br>3 & 4</td>
            <td class="border border-slate-400 p-1"><input type="number" id="ts3" oninput="calculateAll()" class="w-full text-center border-none focus:outline-none" placeholder="-"></td>
            <td class="border border-slate-400 p-1"><input type="number" id="ms3" oninput="calculateAll()" class="w-full text-center border-none focus:outline-none" placeholder="-"></td>
            <td class="border border-slate-400 p-1"><input type="number" id="ds2" oninput="calculateAll()" class="w-full text-center border-none focus:outline-none" placeholder="-"></td>
          </tr>
          <tr>
            <td class="border border-slate-400 p-1">-</td>
            <td class="border border-slate-400 p-1"><input type="number" id="ms4" oninput="calculateAll()" class="w-full text-center border-none focus:outline-none" placeholder="-"></td>
            <td class="border border-slate-400 p-1"><input type="number" id="ds3" oninput="calculateAll()" class="w-full text-center border-none focus:outline-none" placeholder="-"></td>
          </tr>

          <!-- Average Row -->
          <tr class="bg-green-500 text-black font-extrabold text-sm">
            <td class="border border-slate-400 p-2 text-left">AVERAGE</td>
            <td id="avgTS" class="border border-slate-400 p-2">-</td>
            <td id="avgMS" class="border border-slate-400 p-2">-</td>
            <td id="avgDS" class="border border-slate-400 p-2">-</td>
          </tr>
          <tr class="bg-green-400 text-black font-extrabold text-sm">
            <td colspan="4" id="grandAVG" class="border border-slate-400 p-2 text-center">-</td>
          </tr>
        </tbody>
      </table>
    </div>

  </div>

  <!-- Script Logika Perhitungan -->
  <script>
    function getTransformedValue(id, isUpload) {
      const val = parseFloat(document.getElementById(id).value);
      if (isNaN(val)) return null;

      if (!isUpload) return val;

      const minRct = parseFloat(document.getElementById('minRct').value) || 0;
      const faktorPct = (parseFloat(document.getElementById('faktor').value) || 0) / 100;

      // Rumus Pengolahan: Data - ((Data - MinRCT) * % Faktor)
      return val - ((val - minRct) * faktorPct);
    }

    function calculateAll() {
      const isUpload = document.getElementById('modeView').value === 'upload';

      // 1. TS (Rata-rata 3 data)
      const tsVals = ['ts1', 'ts2', 'ts3'].map(id => getTransformedValue(id, isUpload)).filter(v => v !== null);
      const avgTS = tsVals.length ? (tsVals.reduce((a, b) => a + b, 0) / tsVals.length) : 0;

      // 2. DS (Rata-rata 3 data)
      const dsVals = ['ds1', 'ds2', 'ds3'].map(id => getTransformedValue(id, isUpload)).filter(v => v !== null);
      const avgDS = dsVals.length ? (dsVals.reduce((a, b) => a + b, 0) / dsVals.length) : 0;

      // 3. MS (Data 1 & 2 di-average dulu, lalu di-average dengan Data 3 & Data 4)
      const m1 = getTransformedValue('ms1', isUpload);
      const m2 = getTransformedValue('ms2', isUpload);
      const m3 = getTransformedValue('ms3', isUpload);
      const m4 = getTransformedValue('ms4', isUpload);

      let msComponents = [];
      if (m1 !== null && m2 !== null) msComponents.push((m1 + m2) / 2);
      else if (m1 !== null) msComponents.push(m1);
      else if (m2 !== null) msComponents.push(m2);

      if (m3 !== null) msComponents.push(m3);
      if (m4 !== null) msComponents.push(m4);

      const avgMS = msComponents.length ? (msComponents.reduce((a, b) => a + b, 0) / msComponents.length) : 0;

      // Output Render
      document.getElementById('avgTS').innerText = avgTS ? avgTS.toFixed(2) : '-';
      document.getElementById('avgMS').innerText = avgMS ? avgMS.toFixed(2) : '-';
      document.getElementById('avgDS').innerText = avgDS ? avgDS.toFixed(2) : '-';

      const grand = (avgTS + avgMS + avgDS) / 3;
      document.getElementById('grandAVG').innerText = grand ? grand.toFixed(2) : '-';
    }

    function resetForm() {
      document.querySelectorAll('input[type="number"]').forEach(input => {
        if (!['faktor', 'minRct', 'temp', 'rh'].includes(input.id)) input.value = '';
      });
      calculateAll();
    }
  </script>
</body>
</html>
